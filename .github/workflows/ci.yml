# CI quality gates (INT-3877 steps 6-10).
# Offline checks (lint, audit, secret scan, tests) run on every PR.
# The live-API suite runs only on push to master: Actions secrets are not
# exposed to fork PRs, and the suite performs real writes.
name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - 'README*'
      - 'CHANGELOG.md'
  pull_request:
    branches: [master]
    paths-ignore:
      - 'README*'
      - 'CHANGELOG.md'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ruff
        run: pip install ruff==0.16.8
      - name: Lint
        run: ruff check .

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pip-audit
        run: pip install pip-audit
      # pip-audit has no severity filter; it fails on any known
      # vulnerability, which is stricter than the "high severity" gate
      # the ticket asks for.
      - name: Audit dependencies
        run: pip-audit -r requirements.txt

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks-action requires a license for organization repos;
      # the CLI performs the same full-history scan without one.
      - name: Run gitleaks (full history)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --verbose .

  test-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install build
      - name: Build package
        run: python -m build
      - name: Import smoke test
        run: |
          pip install .
          python -c "import onfleet; print(onfleet.Onfleet)"
      # Without ONFLEET_API_KEY the live-API tests skip; this verifies
      # collection and the offline paths only.
      - name: Run test suite (offline)
        run: python -m unittest discover -s test -v

  test-live:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, test-offline]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run test suite (live API)
        env:
          ONFLEET_API_KEY: ${{ secrets.ONFLEET_API_KEY }}
        run: python -m unittest discover -s test -v
