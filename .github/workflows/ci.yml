# CI quality gates (INT-3877 steps 6-10).
# Offline checks (lint, audit, secret scan, tests) run on every PR.
# The live-API suite runs only on push to master: Actions secrets are not
# exposed to fork PRs, and the suite performs real writes.
name: CI

# No paths-ignore here: these checks become required via branch
# protection (INT-3877 step 12), and a required check that never
# triggers leaves doc-only PRs stuck in the "Expected" state.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

# Cancel superseded runs on PR churn only. Push runs to master include
# the live-API suite, which mutates real data; a mid-test cancellation
# would leave test resources behind.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ruff
        run: pip install ruff==0.16.8
      - name: Lint
        run: ruff check .

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pip-audit
        run: pip install pip-audit==2.10.1
      # pip-audit has no severity filter; it fails on any known
      # vulnerability, which is stricter than the "high severity" gate
      # the ticket asks for.
      - name: Audit dependencies
        run: pip-audit -r requirements.txt

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # gitleaks-action requires a license for organization repos;
      # the CLI performs the same full-history scan without one.
      - name: Run gitleaks (full history)
        run: |
          curl -sSfLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          ./gitleaks git --redact --verbose .

  test-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install build==1.6.1
      - name: Build package
        run: python -m build
      # Install the wheel the build step produced, not the source tree,
      # so the smoke test exercises the artifact pypi-publish.yml ships.
      # Import from outside the repo root: in the root, the onfleet/
      # source directory shadows the installed wheel.
      - name: Import smoke test
        run: |
          pip install dist/*.whl
          cd "$RUNNER_TEMP"
          python -c "import onfleet; print(onfleet.Onfleet)"
      # Without ONFLEET_API_KEY the live-API tests skip; the API-free
      # unit tests in test_request_offline.py still run and assert.
      - name: Run test suite (offline)
        run: python -m unittest discover -s test -v

  # The job stays disabled until the ONFLEET_API_KEY secret has a value:
  # set the LIVE_SUITE_ENABLED repository variable to 'true' when the
  # secret lands. Secrets are not readable in job-level `if` expressions;
  # variables are. This avoids a red master while the secret is pending.
  test-live:
    if: github.event_name == 'push' && vars.LIVE_SUITE_ENABLED == 'true'
    needs: [lint, test-offline]
    uses: ./.github/workflows/live-suite.yml
    secrets: inherit
