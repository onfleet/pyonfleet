# This workflow will upload a Python Package using Twine when a release is created
# For more information see: https://help.github.com/en/actions/language-and-framework-guides/using-python-with-github-actions#publishing-to-package-registries

name: Publish to PyPi

on:
  release:
    types: [published]

# The token needs no write access: PyPI uses PYPI_API_TOKEN and Slack
# uses a webhook secret.
permissions:
  contents: read

jobs:

  # Release gate: the shared live-API suite. Unlike ci.yml, this call is
  # not gated on LIVE_SUITE_ENABLED — a release must never skip tests,
  # so a missing secret fails the run loudly inside the suite.
  test:
    uses: ./.github/workflows/live-suite.yml
    secrets: inherit

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build==1.6.1
    - name: Build package
      run: python -m build
    - name: Publish package
      uses: pypa/gh-action-pypi-publish@27b31702a0e7fc50959f5ad993c78deac1bdfc29
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}
  
  notify:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # TODO: bump slack-github-action (v2+ changed the webhook inputs;
      # the payload and SLACK_WEBHOOK_TYPE need a review with the bump).
      - uses: slackapi/slack-github-action@v1.18.0
        with:
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":python: A new version of `pyonfleet` has been released: `${{ github.event.release.tag_name }}` :tada:"
                  },
                  "accessory": {
                    "type": "button",
                    "text": {
                      "type": "plain_text",
                      "text": "See details"
                    },
                    "url": "${{ github.event.release.html_url }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
