# This workflow will upload a Python Package using Twine when a release is created
# For more information see: https://help.github.com/en/actions/language-and-framework-guides/using-python-with-github-actions#publishing-to-package-registries

name: Publish to PyPi

on:
  release:
    types: [published]

jobs:

  # Single Python version: the live-API suite mutates real data in the
  # test organization, so concurrent matrix jobs would race each other.
  # Per-version coverage runs offline in ci.yml.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: pip install -r requirements.txt
    # Without the secret the suite skips every test and the release gate
    # would pass green with zero assertions. Fail loudly instead.
    - name: Require ONFLEET_API_KEY
      env:
        ONFLEET_API_KEY: ${{ secrets.ONFLEET_API_KEY }}
      run: |
        if [ -z "$ONFLEET_API_KEY" ]; then
          echo "::error::ONFLEET_API_KEY secret is not set; the live-API suite cannot run (INT-3877 step 5)."
          exit 1
        fi
    - name: Run test suite
      env:
        ONFLEET_API_KEY: ${{ secrets.ONFLEET_API_KEY }}
      run: python -m unittest discover -s test -v

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build
    - name: Build package
      run: python -m build
    - name: Publish package
      uses: pypa/gh-action-pypi-publish@27b31702a0e7fc50959f5ad993c78deac1bdfc29
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}
  
  notify:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: slackapi/slack-github-action@v1.18.0
        with:
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":python: A new version of `pyonfleet` has been released: `${{ github.event.release.tag_name }}` :tada:"
                  },
                  "accessory": {
                    "type": "button",
                    "text": {
                      "type": "plain_text",
                      "text": "See details"
                    },
                    "url": "${{ github.event.release.html_url }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
