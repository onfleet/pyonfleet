# Minimal ruff configuration (INT-3877 step 8).
target-version = "py310"
line-length = 120

[lint]
# Pinned rule set: pycodestyle errors (incl. E501 line length),
# pyflakes, import sorting.
# Pinning keeps CI deterministic across ruff versions.
select = ["E4", "E5", "E7", "E9", "F", "I"]

[lint.per-file-ignores]
# Re-export module: the imports exist for `onfleet.<name>` access and
# are deliberately absent from `__all__`.
"onfleet/__init__.py" = ["F401"]
