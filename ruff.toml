# Minimal ruff configuration (INT-3877 step 8).
target-version = "py310"
line-length = 120

[lint]
# Pinned rule set: pycodestyle errors, pyflakes, import sorting.
# Pinning keeps CI deterministic across ruff versions.
select = ["E4", "E7", "E9", "F", "I"]

[lint.per-file-ignores]
# The test suite mutates sys.path before the onfleet import (import order).
"test/*" = ["E402", "I001"]
